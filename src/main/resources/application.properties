spring.application.name=controle-clientes-backend


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# Tabelas criadas pelo Flyway (src/main/resources/db/migration); o Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.mvc.problemdetails.enabled=true

# Login (JWT). Em producao, definir JWT_SEGREDO com pelo menos 32 caracteres aleatoios.
app.jwt.segredo=${JWT_SEGREDO}
app.jwt.validade=8h

# Usuario criado automaticamente se o banco nao tiver nenhum
app.admin.usuario=${ADMIN_USUARIO}
app.admin.senha=${ADMIN_SENHA}

# Endereços do frontend autorizados a chamar a API (separados por vírgula)
app.cors.origens=${CORS_ORIGENS}
