services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controle_clientes
      POSTGRES_USER: controle_user
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle_user -d controle_clientes"]
      interval: 5s
      retries: 10

  api:
    build: .
    image: controle-clientes-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/controle_clientes
      DB_USUARIO: controle_user
      DB_SENHA: ${DB_SENHA}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
